services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: finbert-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # .env points at 127.0.0.1 for local runs; inside the container the
      # MLflow server on the host is reached through host.docker.internal.
      MLFLOW_TRACKING_URI: http://host.docker.internal:${MLFLOW_PORT:-5000}
    volumes:
      - ./starter/mlruns:/app/mlruns
      - ./starter/mlartifacts:/app/mlartifacts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
