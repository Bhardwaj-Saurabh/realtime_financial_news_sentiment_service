# CI/CD pipeline, on every push to main:
# 1. lint            — ruff over app/, scripts/ and tests/
# 2. test            — pytest tests/ with MODEL_SOURCE=huggingface
# 3. deepchecks      — dvc repro, then scripts/run_deepchecks.py with MODEL_SOURCE=huggingface
#                      (test and deepchecks run in parallel after lint)
# 4. build           — build the Docker image, tag it with the short commit SHA plus a
#                      timestamp, and push that tag and :latest to Amazon ECR
# 5. deploy          — render the ECS task definition with the new image and deploy to ECS Fargate
#
# Required AWS resources: ECR repository finbert-api, ECS cluster finbert-cluster,
# ECS service finbert-api-service and ECS task definition finbert-api.
# Required repository secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION,
# and AWS_SESSION_TOKEN when using temporary credentials.

name: test-and-deploy

on:
  push:
    branches: [main]

env:
  ECR_REPOSITORY: finbert-api
  TASK_DEFINITION: finbert-api
  CONTAINER_NAME: finbert-api
  ECS_SERVICE: finbert-api-service
  ECS_CLUSTER: finbert-cluster
  HF_MODEL_ID: baptle/FinBERT_market_based
  HF_DATASET_ID: baptle/financial_headlines_market_based
  # CPU-only PyTorch wheels; avoids several GB of CUDA libraries.
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.4
      - run: ruff check app/ scripts/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: starter
    env:
      MODEL_SOURCE: huggingface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-test-${{ env.HF_MODEL_ID }}

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Run integration tests
        run: pytest tests/

  deepchecks:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: starter
    env:
      MODEL_SOURCE: huggingface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache HuggingFace model and dataset
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-deepchecks-${{ env.HF_MODEL_ID }}-${{ env.HF_DATASET_ID }}

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Generate data
        run: dvc repro

      - name: Run Deepchecks drift checks
        run: python scripts/run_deepchecks.py

  build:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    needs: [test, deepchecks]
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION" \
            --query taskDefinition > task-definition.json

      - name: Render task definition with new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build.outputs.image_tag }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
